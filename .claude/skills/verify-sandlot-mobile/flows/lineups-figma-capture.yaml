appId: host.exp.Exponent
---
- runFlow: _ready.yaml
- assertVisible:
    id: "new-game"
- takeScreenshot: games-before-setup
- tapOn:
    id: "new-game"
- extendedWaitUntil:
    visible:
      id: "game-setup"
    timeout: 15000
- tapOn:
    id: "setup-lineup-away"
- extendedWaitUntil:
    visible:
      id: "lineup-screen"
    timeout: 15000
- takeScreenshot: lineup-before-reorder
- scrollUntilVisible:
    element:
      id: "save-lineup"
    direction: DOWN
- takeScreenshot: lineup-reference-bottom
- tapOn:
    id: "save-lineup"
- extendedWaitUntil:
    visible:
      id: "game-setup"
    timeout: 15000
- takeScreenshot: setup-reference-state
- tapOn:
    id: "setup-lineup-home"
- extendedWaitUntil:
    visible:
      id: "lineup-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "change-starting-pitcher"
    direction: DOWN
- tapOn:
    id: "change-starting-pitcher"
- scrollUntilVisible:
    element:
      id: "choose-pitcher-sample-home-3"
    direction: DOWN
- tapOn:
    id: "choose-pitcher-sample-home-3"
- scrollUntilVisible:
    element:
      id: "save-lineup"
    direction: DOWN
- tapOn:
    id: "save-lineup"
- extendedWaitUntil:
    visible:
      id: "start-configured-game"
      enabled: true
    timeout: 15000
- tapOn:
    id: "start-configured-game"
- extendedWaitUntil:
    visible:
      id: "pitch-ball"
    timeout: 15000
- assertVisible:
    id: "waiting-plays"
    text: "1 waiting to sync · Local demo"
- takeScreenshot: field-before-play-draft
- tapOn:
    id: "pitch-in-play"
- extendedWaitUntil:
    visible:
      id: "play-outcomes"
    timeout: 15000
- takeScreenshot: inplay-step-1-outcome
- tapOn:
    id: "outcome-single"
- extendedWaitUntil:
    visible:
      id: "play-fielders"
    timeout: 15000
- tapOn:
    id: "fielder-CF"
- takeScreenshot: inplay-step-2-fielder
- tapOn:
    id: "play-next"
- extendedWaitUntil:
    visible:
      id: "play-runners"
    timeout: 15000
- takeScreenshot: inplay-step-3-runners
- tapOn: "Cancel"
- copyTextFrom:
    id: "current-batter-identity"
- evalScript: ${output.startingBatter = maestro.copiedText}
- copyTextFrom:
    id: "current-pitcher-identity"
- evalScript: ${output.startingPitcher = maestro.copiedText}
- assertTrue: ${output.startingPitcher.includes('N. Cole')}
- tapOn:
    id: "pitch-ball"
- extendedWaitUntil:
    visible:
      id: "waiting-plays"
      text: "2 waiting to sync · Local demo"
    timeout: 15000
- runFlow:
    file: _tap-outcome.yaml
    env:
      OUTCOME: "single"
- tapOn:
    id: "save-play"
- extendedWaitUntil:
    visible:
      id: "waiting-plays"
      text: "3 waiting to sync · Local demo"
    timeout: 15000
- tapOn:
    id: "scorer-more"
- takeScreenshot: more-before-runner-sheet
- tapOn:
    id: "more-steal"
- extendedWaitUntil:
    visible:
      id: "play-runner-action"
    timeout: 15000
- takeScreenshot: runner-sheet-selected-game
- tapOn: "Cancel"
- tapOn:
    id: "tab-plays"
- extendedWaitUntil:
    visible:
      id: "plays-screen"
    timeout: 15000
- takeScreenshot: ordered-saved-play-log
- tapOn:
    id: "tab-field"
- tapOn:
    id: "undo-play"
- extendedWaitUntil:
    visible:
      id: "waiting-plays"
      text: "4 waiting to sync · Local demo"
    timeout: 15000
- assertVisible:
    id: "score-summary"
    text: ".*Count 1 ball and 0 strikes. Bases empty.*"
- copyTextFrom:
    id: "current-batter-identity"
- assertTrue: ${maestro.copiedText === output.startingBatter}
- copyTextFrom:
    id: "current-pitcher-identity"
- assertTrue: ${maestro.copiedText === output.startingPitcher}
- stopApp
- openLink: "exp://localhost:8091?__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1"
- extendedWaitUntil:
    visible:
      id: "resume-game"
    timeout: 90000
- tapOn:
    id: "resume-game"
- extendedWaitUntil:
    visible:
      id: "score-summary"
      text: ".*Count 1 ball and 0 strikes. Bases empty.*"
    timeout: 15000
- copyTextFrom:
    id: "current-batter-identity"
- assertTrue: ${maestro.copiedText === output.startingBatter}
- copyTextFrom:
    id: "current-pitcher-identity"
- assertTrue: ${maestro.copiedText === output.startingPitcher}
- takeScreenshot: chosen-lineups-game-after-reopening
- tapOn:
    id: "tab-plays"
- extendedWaitUntil:
    visible:
      id: "plays-screen"
    timeout: 15000
- takeScreenshot: saved-undo-history-after-reopening
