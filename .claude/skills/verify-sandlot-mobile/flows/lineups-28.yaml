appId: host.exp.Exponent
---
# #28: the scorer sets both lineups in Game setup, has a start rejected for want of a pitcher, fixes it, starts, then reads the saved
# log with an undone play in it and finds it again after reopening. Needs a phone with no saved local game.
- runFlow: _ready.yaml
- assertVisible:
    id: "start-game"
- waitForAnimationToEnd
# Known bug, tracked in #115: the first Start game tap can be dropped on a fresh phone (likely while the app is saving, when
# the button is disabled). Retry it until Game setup opens. Remove this retry when #115 is fixed so the flow catches it again.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: "start-setup"
          commands:
            - tapOn:
                id: "start-game"
      - extendedWaitUntil:
          visible:
            id: "start-setup"
          timeout: 15000
# Game setup: Start is off, the half is pre-filled, and the rows say Not set yet.
- assertVisible: "New game"
- assertVisible: "Set both lineups to start"
- assertVisible:
    id: "start-setup"
    enabled: false
- assertVisible: "Second half since Oct 1, so pitchers can get 9 outs a day. Change it if your league switched on another date."
- assertVisible:
    id: "lineup-summary-away"
    text: "Not set yet"
- takeScreenshot: setup-empty
- tapOn:
    id: "half-first"
- tapOn:
    id: "half-second"
# Hawks lineup: bats only, a position change and back, a drag and back, and the starting pitcher changed and back.
- tapOn:
    id: "lineup-away"
# Save lineup is the last thing in the scrolling page, so on a phone it is below the fold: wait for the title instead.
- extendedWaitUntil:
    visible: "Hawks lineup"
    timeout: 15000
- assertVisible: "Everyone here bats, in this order. Drag to reorder, and tap a position to change it."
- takeScreenshot: lineup-hawks-top
# The tenth batter and the pitcher's note are below the fold on a small phone: scroll to them, then back up.
- scrollUntilVisible:
    element:
      text: "B. Lane, Bats only. Change position"
- assertVisible: "B. Lane, Bats only. Change position"
- scrollUntilVisible:
    element:
      id: "starting-pitcher"
- assertVisible:
    id: "starting-pitcher"
    text: ".*Fully rested · 75 pitches available today"
- scrollUntilVisible:
    element:
      id: "position-1"
    direction: UP
- tapOn:
    id: "position-1"
- extendedWaitUntil:
    visible:
      id: "position-sheet"
    timeout: 15000
- assertVisible:
    id: "position-choice-CF"
    text: ".*Swaps with K. Moss"
- takeScreenshot: lineup-position-sheet
- tapOn:
    id: "position-choice-CF"
- assertVisible: "J. Ruiz, CF. Change position"
- assertVisible: "K. Moss, SS. Change position"
- tapOn:
    id: "position-1"
- tapOn:
    id: "position-choice-SS"
- assertVisible: "J. Ruiz, SS. Change position"
- assertVisible: "K. Moss, CF. Change position"
- swipe:
    from:
      id: "drag-handle-0"
    direction: DOWN
    duration: 800
- assertNotVisible: "Reorder K. Moss, batting 1"
- assertVisible: "Reorder K. Moss, batting .*"
- takeScreenshot: lineup-reordered
- swipe:
    from:
      text: "Reorder K. Moss, batting .*"
    direction: UP
    duration: 800
- assertVisible: "Reorder K. Moss, batting 1"
# The starting pitcher: M. Ortiz takes the mound, then T. Nguyen gets it back.
- scrollUntilVisible:
    element:
      id: "change-pitcher"
- scroll
- tapOn:
    id: "change-pitcher"
- extendedWaitUntil:
    visible:
      id: "pitcher-sheet"
    timeout: 15000
- takeScreenshot: lineup-pitcher-sheet
# The sheet's list runs under the Pitch first button on a phone: scroll the row clear of it before tapping.
- scrollUntilVisible:
    element:
      id: "pitcher-choice-home-2"
- scroll
- tapOn:
    id: "pitcher-choice-home-2"
- assertVisible: "Pitch first"
- tapOn:
    id: "pitcher-confirm"
- assertVisible:
    id: "starting-pitcher"
    text: ".*M. Ortiz.*"
- tapOn:
    id: "change-pitcher"
- scrollUntilVisible:
    element:
      id: "pitcher-choice-home-1"
- scroll
- tapOn:
    id: "pitcher-choice-home-1"
- tapOn:
    id: "pitcher-confirm"
- assertVisible:
    id: "starting-pitcher"
    text: ".*T. Nguyen.*"
# Everyone on the roster is already in the lineup, so there is nobody to add.
- scrollUntilVisible:
    element:
      id: "add-player"
- scroll
- tapOn:
    id: "add-player"
- assertVisible: "Everyone on the roster is already in the lineup."
- takeScreenshot: lineup-add-sheet
- tapOn: "Cancel"
# Not playing today: B. Lane comes out of the batting order, then comes back from the roster, last and with no position.
- scrollUntilVisible:
    element:
      id: "position-9"
- tapOn:
    id: "position-9"
# Not playing today is the last row of the position list and starts below the screen on a phone: scroll it into view first.
- extendedWaitUntil:
    visible:
      id: "position-sheet"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "position-remove"
- scroll
- assertVisible:
    id: "position-remove"
    text: ".*Takes B. Lane out of today’s lineup"
- takeScreenshot: lineup-position-remove
- tapOn:
    id: "position-remove"
- assertNotVisible: "B. Lane, Bats only. Change position"
- scrollUntilVisible:
    element:
      id: "add-player"
- scroll
- tapOn:
    id: "add-player"
- extendedWaitUntil:
    visible:
      id: "add-choice-home-10"
    timeout: 15000
- takeScreenshot: lineup-add-sheet-lane
- tapOn:
    id: "add-choice-home-10"
- assertVisible: "B. Lane, Bats only. Change position"
- scrollUntilVisible:
    element:
      id: "save-lineup"
- scroll
- takeScreenshot: lineup-hawks-bottom
- tapOn:
    id: "save-lineup"
# Back on Game setup the Hawks row reads as the Figma frame shows it and Start is still off.
- extendedWaitUntil:
    visible:
      id: "lineup-summary-away"
      text: "10 players · T. Nguyen pitching"
    timeout: 15000
- assertVisible:
    id: "lineup-summary-home"
    text: "Not set yet"
- assertVisible:
    id: "start-setup"
    enabled: false
- takeScreenshot: setup-hawks-set
# Marlins lineup: nobody pitching is saved, and Start is rejected with the engine's reason.
- scrollUntilVisible:
    element:
      id: "lineup-home"
- scroll
- tapOn:
    id: "lineup-home"
- extendedWaitUntil:
    visible: "Marlins lineup"
    timeout: 15000
- tapOn:
    id: "position-0"
- scrollUntilVisible:
    element:
      id: "position-choice-Bats only"
- scroll
- tapOn:
    id: "position-choice-Bats only"
- scrollUntilVisible:
    element:
      id: "starting-pitcher-none"
- assertVisible:
    id: "starting-pitcher-none"
- scrollUntilVisible:
    element:
      id: "save-lineup"
- scroll
- tapOn:
    id: "save-lineup"
- extendedWaitUntil:
    visible:
      id: "lineup-summary-home"
      text: "9 players · no starting pitcher yet"
    timeout: 15000
- assertVisible: "Start game"
- tapOn:
    id: "start-setup"
- extendedWaitUntil:
    visible:
      id: "setup-message"
      text: "The Marlins need a starting pitcher."
    timeout: 15000
- takeScreenshot: setup-rejected
- scrollUntilVisible:
    element:
      id: "lineup-home"
- scroll
- tapOn:
    id: "lineup-home"
- scrollUntilVisible:
    element:
      id: "change-pitcher"
- scroll
- tapOn:
    id: "change-pitcher"
- tapOn:
    id: "pitcher-choice-away-1"
- tapOn:
    id: "pitcher-confirm"
- scrollUntilVisible:
    element:
      id: "save-lineup"
- scroll
- tapOn:
    id: "save-lineup"
- extendedWaitUntil:
    visible:
      id: "lineup-summary-home"
      text: "9 players · J. Soto pitching"
    timeout: 15000
- assertVisible:
    id: "start-setup"
    text: "Start game"
    enabled: true
- assertNotVisible:
    id: "setup-message"
- takeScreenshot: setup-ready
- tapOn:
    id: "start-setup"
# The game starts from what was saved. One ball and an undo, then the log keeps the undone play.
- extendedWaitUntil:
    visible:
      id: "score-summary"
    timeout: 15000
- tapOn:
    id: "pitch-ball"
- extendedWaitUntil:
    visible:
      id: "scorer-undo"
      enabled: true
    timeout: 15000
- tapOn:
    id: "scorer-undo"
- tapOn:
    id: "tab-plays"
- extendedWaitUntil:
    visible: "Undone"
    timeout: 15000
- takeScreenshot: plays-undone
# Close the game and open it again: the same game and the same log.
- tapOn:
    id: "games-navigation"
- extendedWaitUntil:
    visible:
      id: "resume-game"
    timeout: 15000
- tapOn:
    id: "resume-game"
- extendedWaitUntil:
    visible:
      id: "score-summary"
    timeout: 15000
- tapOn:
    id: "tab-plays"
- extendedWaitUntil:
    visible: "Undone"
    timeout: 15000
- takeScreenshot: plays-undone-reopened
- tapOn:
    id: "games-navigation"
