appId: host.exp.Exponent
---
# Once this phone holds scoring again, reopening the game sends the waiting play. Run after live-game-stopped.yaml.
- tapOn:
    id: "games-navigation"
- scrollUntilVisible:
    element:
      id: "resume-live"
    direction: DOWN
- tapOn:
    id: "resume-live"
- extendedWaitUntil:
    visible:
      id: "waiting-plays"
      text: "Last: Ball · All plays saved"
    timeout: 30000
- takeScreenshot: live-resumed
