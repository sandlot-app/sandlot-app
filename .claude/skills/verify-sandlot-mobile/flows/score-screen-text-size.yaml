appId: host.exp.Exponent
---
# The Field tab at the phone's text size: every pitch button, the strike choices, Undo and the "plays saved" line are
# on screen without scrolling. It scores one called strike and undoes it, so each text size starts from the same count.
# Set the text size first with `xcrun simctl ui <simulator> content_size <size>`. Built from PR #116's score-bar-text-size.yaml.
#
# On the simulator a tap is sometimes cancelled before it lifts, at any text size: the app logs the touch as terminated,
# with no re-render under the finger. So each tap sits in a retry that taps only while its result is still missing.
- runFlow: _ready.yaml
# Right after launch the first tap on Start can land before the home screen is ready, so wait for it to settle.
# A later run at another text size starts on the scoring screen instead.
- extendedWaitUntil:
    visible:
      id: "start-game|resume-game|score-summary"
    timeout: 15000
- waitForAnimationToEnd
# Known bug, tracked in #115: the first Start demo game tap can be dropped, so retry it until Game setup opens, then set up
# the game as _start-local-game.yaml does. Go back to `runFlow: _start-local-game.yaml` when #115 is fixed.
- runFlow:
    when:
      visible:
        id: "start-game"
    commands:
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  notVisible:
                    id: "start-setup"
                commands:
                  - tapOn:
                      id: "start-game"
            - extendedWaitUntil:
                visible:
                  id: "start-setup"
                timeout: 15000
      - scrollUntilVisible:
          element:
            id: "lineup-home"
      - scroll
      - tapOn:
          id: "lineup-home"
      - scrollUntilVisible:
          element:
            id: "save-lineup"
      - scroll
      - tapOn:
          id: "save-lineup"
      - tapOn:
          id: "lineup-away"
      - scrollUntilVisible:
          element:
            id: "save-lineup"
      - scroll
      - tapOn:
          id: "save-lineup"
      - tapOn:
          id: "start-setup"
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: "resume-game"
          commands:
            - tapOn:
                id: "resume-game"
      - extendedWaitUntil:
          visible:
            id: "score-summary"
          timeout: 10000
- extendedWaitUntil:
    visible:
      id: "score-summary"
    timeout: 15000
- waitForAnimationToEnd
- assertVisible:
    id: "pitch-ball"
- assertVisible:
    id: "pitch-strike"
- assertVisible:
    id: "pitch-foul"
- assertVisible:
    id: "pitch-in-play"
- assertVisible:
    id: "scorer-undo"
- assertVisible:
    id: "scorer-more"
- assertVisible:
    id: "voice-bar"
- assertVisible:
    id: "waiting-plays"
- copyTextFrom:
    id: "score-summary"
- evalScript: ${output.before = maestro.copiedText}
- evalScript: ${output.strikes = parseInt(output.before.match(/Count [0-3] balls? and ([0-2]) strikes?/)[1], 10)}
# A third strike would end the at-bat and the count check below would never match, so start from fewer than two strikes.
- assertTrue: ${output.strikes < 2}
- takeScreenshot: field-start
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: "strike-looking"
          commands:
            - tapOn:
                id: "pitch-strike"
      - extendedWaitUntil:
          visible:
            id: "strike-looking"
          timeout: 5000
- assertVisible:
    id: "strike-swinging"
- assertVisible:
    id: "pitch-in-play"
- assertVisible:
    id: "scorer-undo"
- assertVisible:
    id: "waiting-plays"
- takeScreenshot: strike-choices
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: "strike-looking"
          commands:
            - tapOn:
                id: "strike-looking"
      - extendedWaitUntil:
          visible:
            id: "score-summary"
            text: ".*outs?\\. Count [0-3] balls? and ${output.strikes + 1} strikes?\\..*"
          timeout: 10000
- assertVisible:
    id: "waiting-plays"
- takeScreenshot: strike-saved
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: "score-summary"
              text: ".*outs?\\. Count [0-3] balls? and ${output.strikes + 1} strikes?\\..*"
          commands:
            - tapOn:
                id: "scorer-undo"
      - extendedWaitUntil:
          visible:
            id: "score-summary"
            text: ".*outs?\\. Count [0-3] balls? and ${output.strikes} strikes?\\..*"
          timeout: 10000
- takeScreenshot: strike-undone
