appId: host.exp.Exponent
---
- runFlow: _ready.yaml
- runFlow:
    when:
      visible:
        id: "start-game"
    commands:
      - tapOn:
          id: "start-game"
- runFlow:
    when:
      visible:
        id: "resume-game"
    commands:
      - tapOn:
          id: "resume-game"
- extendedWaitUntil:
    visible:
      id: "pitch-in-play"
    timeout: 15000
- copyTextFrom:
    id: "score-summary"
- evalScript: ${output.initialSummary = maestro.copiedText}
- copyTextFrom:
    id: "pitch-total"
- evalScript: ${output.initialPitches = maestro.copiedText}
- copyTextFrom:
    id: "waiting-plays"
- evalScript: ${output.initialWaiting = parseInt(maestro.copiedText.match(/(\d+) plays? saved/)[1], 10)}
- tapOn:
    id: "pitch-in-play"
- takeScreenshot: tap-outcomes-before-cancel
- tapOn: "Cancel"
- copyTextFrom:
    id: "waiting-plays"
- assertTrue: ${parseInt(maestro.copiedText.match(/(\d+) plays? saved/)[1], 10) === output.initialWaiting}
- runFlow:
    file: _tap-outcome.yaml
    env:
      OUTCOME: "home-run"
- tapOn:
    id: "save-play"
- extendedWaitUntil:
    notVisible:
      id: "save-play"
    timeout: 15000
- repeat:
    times: 2
    commands:
      - runFlow:
          file: _tap-outcome.yaml
          env:
            OUTCOME: "single"
      - tapOn:
          id: "save-play"
      - extendedWaitUntil:
          notVisible:
            id: "save-play"
          timeout: 15000
- copyTextFrom:
    id: "score-summary"
- evalScript: ${output.setupSummary = maestro.copiedText}
- copyTextFrom:
    id: "pitch-total"
- evalScript: ${output.setupPitches = maestro.copiedText}
- copyTextFrom:
    id: "waiting-plays"
- evalScript: ${output.setupWaiting = parseInt(maestro.copiedText.match(/(\d+) plays? saved/)[1], 10)}
- assertTrue: ${output.setupWaiting === output.initialWaiting + 3}
- tapOn:
    id: "pitch-in-play"
- takeScreenshot: tap-outcome-options
- tapOn:
    id: "outcome-double"
- tapOn:
    id: "fielder-CF"
- takeScreenshot: tap-fielder-selection
- tapOn:
    id: "play-next"
- takeScreenshot: tap-double-destinations
- tapOn:
    id: "save-play"
- extendedWaitUntil:
    notVisible:
      id: "save-play"
    timeout: 15000
- copyTextFrom:
    id: "waiting-plays"
- assertTrue: ${parseInt(maestro.copiedText.match(/(\d+) plays? saved/)[1], 10) === output.setupWaiting + 1}
- copyTextFrom:
    id: "score-summary"
- evalScript: ${output.doubleSummary = maestro.copiedText}
- assertTrue: ${output.doubleSummary !== output.setupSummary}
- copyTextFrom:
    id: "pitch-total"
- evalScript: ${output.doublePitches = maestro.copiedText}
- assertTrue: ${parseInt(output.doublePitches.match(/(\d+)/)[1], 10) === parseInt(output.setupPitches.match(/(\d+)/)[1], 10) + 1}
- takeScreenshot: tap-double-saved
- stopApp
- openLink: "exp://localhost:8091?__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1"
- extendedWaitUntil:
    visible:
      id: "resume-game"
    timeout: 90000
- tapOn:
    id: "resume-game"
- extendedWaitUntil:
    visible:
      id: "score-summary"
    timeout: 15000
- copyTextFrom:
    id: "score-summary"
- assertTrue: ${maestro.copiedText === output.doubleSummary}
- copyTextFrom:
    id: "pitch-total"
- assertTrue: ${maestro.copiedText === output.doublePitches}
- takeScreenshot: tap-double-after-relaunch
- tapOn:
    id: "scorer-undo"
- extendedWaitUntil:
    visible:
      id: "waiting-plays"
      text: ".* ${output.setupWaiting + 2} plays? saved on this phone"
    timeout: 15000
- copyTextFrom:
    id: "score-summary"
- assertTrue: ${maestro.copiedText === output.setupSummary}
- copyTextFrom:
    id: "pitch-total"
- assertTrue: ${maestro.copiedText === output.setupPitches}
- takeScreenshot: tap-whole-play-undone
- tapOn:
    id: "scorer-more"
- takeScreenshot: tap-more
- assertNotVisible: "Pitching change"
- assertNotVisible: "Balk"
- tapOn:
    id: "more-passed_ball"
- takeScreenshot: tap-two-runners
- tapOn:
    id: "destination-.*-home"
    index: 1
- tapOn:
    id: "save-play"
- extendedWaitUntil:
    notVisible:
      id: "save-play"
    timeout: 15000
- copyTextFrom:
    id: "score-summary"
- assertTrue: ${maestro.copiedText !== output.setupSummary}
- copyTextFrom:
    id: "pitch-total"
- assertTrue: ${maestro.copiedText === output.setupPitches}
- takeScreenshot: tap-selected-runner-scores
- tapOn:
    id: "scorer-undo"
- extendedWaitUntil:
    visible:
      id: "score-summary"
      text: "${output.setupSummary}"
    timeout: 15000
- tapOn:
    id: "scorer-more"
- tapOn:
    id: "more-steal"
- tapOn:
    id: "destination-.*-3"
    index: 1
- tapOn:
    id: "destination-.*-2"
    index: 0
- takeScreenshot: tap-steal-choices
- tapOn:
    id: "save-play"
- extendedWaitUntil:
    notVisible:
      id: "save-play"
    timeout: 15000
- copyTextFrom:
    id: "pitch-total"
- assertTrue: ${maestro.copiedText === output.setupPitches}
- takeScreenshot: tap-two-steals-saved
- tapOn:
    id: "scorer-undo"
- extendedWaitUntil:
    visible:
      id: "score-summary"
      text: "${output.setupSummary}"
    timeout: 15000
- tapOn:
    id: "scorer-more"
- tapOn:
    id: "more-pickoff"
- tapOn:
    id: "destination-.*-out"
    index: 0
- tapOn:
    id: "save-play"
- extendedWaitUntil:
    notVisible:
      id: "save-play"
    timeout: 15000
- takeScreenshot: tap-pickoff-saved
- tapOn:
    id: "scorer-undo"
- extendedWaitUntil:
    visible:
      id: "score-summary"
      text: "${output.setupSummary}"
    timeout: 15000
- tapOn:
    id: "scorer-more"
- tapOn:
    id: "more-wild_pitch"
- tapOn:
    id: "destination-.*-home"
    index: 1
- tapOn:
    id: "save-play"
- extendedWaitUntil:
    notVisible:
      id: "save-play"
    timeout: 15000
- copyTextFrom:
    id: "pitch-total"
- assertTrue: ${maestro.copiedText === output.setupPitches}
- takeScreenshot: tap-wild-pitch-saved
- tapOn:
    id: "scorer-undo"
- extendedWaitUntil:
    visible:
      id: "score-summary"
      text: "${output.setupSummary}"
    timeout: 15000
- copyTextFrom:
    id: "waiting-plays"
- evalScript: ${output.beforeBuntWaiting = maestro.copiedText}
- runFlow:
    file: _tap-outcome.yaml
    env:
      OUTCOME: "sac-bunt"
- tapOn:
    id: "save-play"
- extendedWaitUntil:
    visible:
      id: "play-message"
      text: ".*Bunting is not allowed.*"
    timeout: 15000
- takeScreenshot: tap-mustang-bunt-rejected
- tapOn: "Cancel"
- copyTextFrom:
    id: "waiting-plays"
- assertTrue: ${maestro.copiedText === output.beforeBuntWaiting}
- tapOn:
    id: "scorer-more"
- tapOn:
    id: "more-wild_pitch"
- tapOn:
    id: "destination-.*-3"
    index: 1
- tapOn:
    id: "save-play"
- extendedWaitUntil:
    notVisible:
      id: "save-play"
    timeout: 15000
- evalScript: ${output.clarificationPitches = (2 - parseInt(output.setupSummary.match(/([0-2]) outs?/)[1], 10)) * 3}
- repeat:
    times: ${output.clarificationPitches}
    commands:
      - copyTextFrom:
          id: "waiting-plays"
      - evalScript: ${output.beforePitch = parseInt(maestro.copiedText.match(/(\d+) plays? saved/)[1], 10)}
      - tapOn:
          id: "pitch-strike"
      - tapOn:
          id: "strike-looking"
      - extendedWaitUntil:
          visible:
            id: "waiting-plays"
            text: ".* ${output.beforePitch + 1} plays? saved on this phone"
          timeout: 15000
- copyTextFrom:
    id: "score-summary"
- evalScript: ${output.thirdOutBefore = maestro.copiedText}
- evalScript: ${output.thirdOutBeforeScore = output.thirdOutBefore.split('. Inning')[0]}
- runFlow:
    file: _tap-outcome.yaml
    env:
      OUTCOME: "fielders-choice"
- tapOn:
    id: "destination-.*-home"
    index: 2
- tapOn:
    id: "destination-.*-out"
    index: 1
# On a short phone like the iPhone SE the runners list runs below the fold.
- scrollUntilVisible:
    element:
      id: "third-out-evidence"
- tapOn:
    id: "out-type-.*-force"
- takeScreenshot: tap-force-third-out-choice
- tapOn:
    id: "save-play"
- extendedWaitUntil:
    notVisible:
      id: "save-play"
    timeout: 15000
- copyTextFrom:
    id: "score-summary"
- assertTrue: ${maestro.copiedText.split('. Inning')[0] === output.thirdOutBeforeScore}
- takeScreenshot: tap-force-third-out-no-run
- tapOn:
    id: "scorer-undo"
- extendedWaitUntil:
    visible:
      id: "score-summary"
      text: "${output.thirdOutBefore}"
    timeout: 15000
- runFlow:
    file: _tap-outcome.yaml
    env:
      OUTCOME: "fielders-choice"
- tapOn:
    id: "destination-.*-home"
    index: 2
- tapOn:
    id: "destination-.*-out"
    index: 1
- tapOn:
    id: "out-type-.*-non_force"
- takeScreenshot: tap-tag-third-out-choice
- tapOn:
    id: "save-play"
- extendedWaitUntil:
    notVisible:
      id: "save-play"
    timeout: 15000
- copyTextFrom:
    id: "score-summary"
- assertTrue: ${maestro.copiedText.split('. Inning')[0] !== output.thirdOutBeforeScore}
- takeScreenshot: tap-tag-third-out-run-counts
- tapOn:
    id: "scorer-undo"
- extendedWaitUntil:
    visible:
      id: "score-summary"
      text: "${output.thirdOutBefore}"
    timeout: 15000
- repeat:
    times: ${output.clarificationPitches + 1}
    commands:
      - copyTextFrom:
          id: "waiting-plays"
      - evalScript: ${output.beforeUndo = parseInt(maestro.copiedText.match(/(\d+) plays? saved/)[1], 10)}
      - tapOn:
          id: "scorer-undo"
      - extendedWaitUntil:
          visible:
            id: "waiting-plays"
            text: ".* ${output.beforeUndo + 1} plays? saved on this phone"
          timeout: 15000
- copyTextFrom:
    id: "score-summary"
- assertTrue: ${maestro.copiedText === output.setupSummary}
- repeat:
    times: 3
    commands:
      - copyTextFrom:
          id: "waiting-plays"
      - evalScript: ${output.beforeUndo = parseInt(maestro.copiedText.match(/(\d+) plays? saved/)[1], 10)}
      - tapOn:
          id: "scorer-undo"
      - extendedWaitUntil:
          visible:
            id: "waiting-plays"
            text: ".* ${output.beforeUndo + 1} plays? saved on this phone"
          timeout: 15000
- copyTextFrom:
    id: "score-summary"
- assertTrue: ${maestro.copiedText === output.initialSummary}
- copyTextFrom:
    id: "pitch-total"
- assertTrue: ${maestro.copiedText === output.initialPitches}
- takeScreenshot: tap-original-game-restored
