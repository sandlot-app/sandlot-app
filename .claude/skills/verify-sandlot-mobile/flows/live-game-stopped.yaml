appId: host.exp.Exponent
---
# When another phone holds scoring, the next upload stops the queue, the play stays on this phone, and the line says why.
# Run after handing the game's scoring to another user (private.take_over).
- repeat:
    times: 3
    while:
      visible:
        id: "games-navigation"
    commands:
      - tapOn:
          id: "games-navigation"
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "resume-live"
    direction: DOWN
- tapOn:
    id: "resume-live"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "score-summary"
    timeout: 20000
- tapOn:
    id: "pitch-ball"
- extendedWaitUntil:
    visible:
      id: "waiting-plays"
      text: "1 play waiting · Sync stopped: another phone is scoring"
    timeout: 30000
- takeScreenshot: live-stopped
