appId: host.exp.Exponent
---
- runFlow: offline-scoring.yaml
- copyTextFrom:
    id: "score-summary"
- evalScript: ${output.before = maestro.copiedText}
- copyTextFrom:
    id: "waiting-plays"
- evalScript: ${output.waiting = parseInt(maestro.copiedText.match(/(\d+) plays? saved/)[1], 10)}
- takeScreenshot: scoring-dock-before-scroll
- repeat:
    times: 3
    commands:
      - swipe:
          from:
            id: "game-content"
          direction: UP
      - assertVisible:
          id: "pitch-ball"
      - assertVisible:
          id: "pitch-strike"
      - assertVisible:
          id: "pitch-foul"
      - assertVisible:
          id: "pitch-in-play"
      - assertVisible:
          id: "scorer-more"
      - assertVisible:
          id: "scorer-undo"
- takeScreenshot: scoring-dock-after-scroll
- tapOn:
    id: "pitch-ball"
- extendedWaitUntil:
    visible:
      id: "waiting-plays"
      text: ".* ${output.waiting + 1} plays? saved on this phone"
    timeout: 15000
- takeScreenshot: scoring-dock-saved-pitch
- tapOn:
    id: "scorer-undo"
- extendedWaitUntil:
    visible:
      id: "waiting-plays"
      text: ".* ${output.waiting + 2} plays? saved on this phone"
    timeout: 15000
- takeScreenshot: scoring-dock-undone-pitch
- repeat:
    times: 3
    commands:
      - swipe:
          from:
            id: "game-content"
          direction: DOWN
- copyTextFrom:
    id: "score-summary"
- assertTrue: ${maestro.copiedText === output.before}
- assertVisible:
    id: "pitch-ball"
- assertVisible:
    id: "scorer-undo"
- takeScreenshot: scoring-dock-restored-count
