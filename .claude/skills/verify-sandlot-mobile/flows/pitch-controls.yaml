appId: host.exp.Exponent
---
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "score-summary"
- copyTextFrom:
    id: "score-summary"
- evalScript: ${output.before = maestro.copiedText}
- copyTextFrom:
    id: "waiting-plays"
- evalScript: ${output.waiting = parseInt(maestro.copiedText, 10)}
- takeScreenshot: called_strike-before
- tapOn:
    id: "pitch-called_strike"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "waiting-plays"
      text: "${output.waiting + 1} waiting to sync · Local demo"
    timeout: 15000
- takeScreenshot: called_strike-saved
- tapOn:
    id: "undo-play"
- extendedWaitUntil:
    visible:
      id: "waiting-plays"
      text: "${output.waiting + 2} waiting to sync · Local demo"
    timeout: 15000
- copyTextFrom:
    id: "score-summary"
- assertTrue: ${maestro.copiedText === output.before}
- takeScreenshot: called_strike-undone
- copyTextFrom:
    id: "score-summary"
- evalScript: ${output.before = maestro.copiedText}
- copyTextFrom:
    id: "waiting-plays"
- evalScript: ${output.waiting = parseInt(maestro.copiedText, 10)}
