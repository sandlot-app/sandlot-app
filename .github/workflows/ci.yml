name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sandlot/engine fixtures:check --base "$FIXTURE_BASE_SHA"
        env:
          FIXTURE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: pnpm verify
      - run: pnpm --filter @sandlot/mobile bundle
      - run: pnpm --filter @sandlot/web build
