name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm --filter @sandlot/mobile bundle

  backend:
    runs-on: ubuntu-latest
    env:
      SUPABASE_USE_SLIM_IMAGES: 'true'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - uses: supabase/setup-cli@v1
        with:
          version: '2.122.0'
      - run: deno check --frozen index.ts handler.ts
        working-directory: supabase/functions/sync-events
      - run: deno test --frozen handler_test.ts
        working-directory: supabase/functions/sync-events
      - run: supabase db start
      - run: supabase test db --local
      - if: always()
        run: supabase stop --no-backup
