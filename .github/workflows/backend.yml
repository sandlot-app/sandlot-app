name: Backend

on:
  pull_request:
    paths: ['supabase/**', 'packages/engine/**', '.github/workflows/backend.yml']
  push:
    paths: ['supabase/**', 'packages/engine/**', '.github/workflows/backend.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - uses: supabase/setup-cli@v1
        with:
          version: '2.122.0'
      - run: deno check --frozen index.ts handler.ts
        working-directory: supabase/functions/sync-events
      - run: deno test --frozen handler_test.ts
        working-directory: supabase/functions/sync-events
      - run: deno check send-samples.ts
        working-directory: supabase/scripts
      - run: supabase db start
      - run: supabase test db --local
