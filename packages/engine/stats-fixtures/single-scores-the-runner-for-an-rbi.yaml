name: A single that scores the runner from second gives the runner a run and the batter an RBI
cite: Official Baseball Rules 9.02(a)(2) and (4), and 9.04(a)(1),
  https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf
preset: moraga-mustang-first-half
started: true
given:
  nextBatter: { home: 0, away: 1 }
  bases:
    2: { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
when:
  - - { kind: pitch, result: in_play }
    - kind: ball_in_play
      outcome: single
      trajectory: line
      fielders: [CF]
      advances: [{ runner: { kind: opponent, id: away-1 }, to: home }]
then:
  score: { home: 0, away: 1 }
batting:
  away-1: { plateAppearances: 0, atBats: 0, hits: 0, doubles: 0, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 0, strikeouts: 0, runs: 1, runsBattedIn: 0 }
  away-2: { plateAppearances: 1, atBats: 1, hits: 1, doubles: 0, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 0, strikeouts: 0, runs: 0, runsBattedIn: 1 }
