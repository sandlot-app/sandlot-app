name: A run that scores on an error or on a force double play counts for the runner but is no one's RBI
cite: Official Baseball Rules 9.02(a)(2) and (4), 9.04(a)(1) for a run aided by an error, 9.04(a)(3) left to the scorer,
  and 9.04(b)(1) for the force double play,
  https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf
preset: moraga-mustang-first-half
started: true
given:
  nextBatter: { home: 0, away: 0 }
  bases:
    2: { player: { kind: opponent, id: away-9 }, chargedTo: { kind: player, id: home-1 } }
    3: { player: { kind: opponent, id: away-8 }, chargedTo: { kind: player, id: home-1 } }
when:
  - - { kind: pitch, result: in_play }
    - kind: ball_in_play
      outcome: error
      trajectory: ground
      fielders: [SS]
      advances:
        - { runner: { kind: opponent, id: away-8 }, to: home }
        - { runner: { kind: opponent, id: away-9 }, to: 3 }
  - - { kind: pitch, result: in_play }
    - kind: ball_in_play
      outcome: double_play
      trajectory: ground
      fielders: [SS, 2B, 1B]
      advances:
        - { runner: { kind: opponent, id: away-1 }, to: out, outType: force }
        - { runner: { kind: opponent, id: away-2 }, to: out, outType: batter_before_first }
        - { runner: { kind: opponent, id: away-9 }, to: home }
then:
  outs: 2
  score: { home: 0, away: 2 }
batting:
  away-1: { plateAppearances: 1, atBats: 1, hits: 0, doubles: 0, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 0, strikeouts: 0, runs: 0, runsBattedIn: 0 }
  away-2: { plateAppearances: 1, atBats: 1, hits: 0, doubles: 0, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 0, strikeouts: 0, runs: 0, runsBattedIn: 0 }
  away-8: { plateAppearances: 0, atBats: 0, hits: 0, doubles: 0, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 0, strikeouts: 0, runs: 1, runsBattedIn: 0 }
  away-9: { plateAppearances: 0, atBats: 0, hits: 0, doubles: 0, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 0, strikeouts: 0, runs: 1, runsBattedIn: 0 }
