name: A ground-ball double play on the batter and a runner who was never forced still gives the batter the RBI
cite: Official Baseball Rules 9.04(a)(1); 9.04(b)(1) and Definitions of Terms, Reverse Force Double Play, need the second
  out on a runner whose force the first out removed, and a runner from second with first base open was never forced,
  https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf
preset: moraga-mustang-first-half
started: true
given:
  nextBatter: { home: 0, away: 0 }
  bases:
    2: { player: { kind: opponent, id: away-8 }, chargedTo: { kind: player, id: home-1 } }
    3: { player: { kind: opponent, id: away-9 }, chargedTo: { kind: player, id: home-1 } }
when:
  - - { kind: pitch, result: in_play }
    - kind: ball_in_play
      outcome: double_play
      trajectory: ground
      fielders: [SS, 1B, 3B]
      advances:
        - { runner: { kind: opponent, id: away-1 }, to: out, outType: batter_before_first }
        - { runner: { kind: opponent, id: away-8 }, to: out, outType: non_force }
        - { runner: { kind: opponent, id: away-9 }, to: home }
then:
  outs: 2
  score: { home: 0, away: 1 }
batting:
  away-1: { plateAppearances: 1, atBats: 1, hits: 0, doubles: 0, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 0, strikeouts: 0, runs: 0, runsBattedIn: 1 }
  away-9: { plateAppearances: 0, atBats: 0, hits: 0, doubles: 0, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 0, strikeouts: 0, runs: 1, runsBattedIn: 0 }
