name: A walk, a hit by pitch, a sacrifice fly and a sacrifice bunt are plate appearances but not at-bats
cite: Official Baseball Rules 9.02(a)(1)(A) to (C), 9.08, 9.14, 5.05(b)(1) and (2),
  https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf
preset: moraga-mustang-first-half
started: true
rules:
  bunting: true
when:
  - [{ kind: pitch, result: ball }]
  - [{ kind: pitch, result: ball }]
  - [{ kind: pitch, result: ball }]
  - [{ kind: pitch, result: ball }]
  - [{ kind: pitch, result: hit_by_pitch }]
  - - { kind: pitch, result: in_play }
    - kind: ball_in_play
      outcome: sacrifice_fly
      trajectory: fly
      fielders: [CF]
      advances:
        - { runner: { kind: opponent, id: away-1 }, to: 3 }
        - { runner: { kind: opponent, id: away-2 }, to: 2 }
  - - { kind: pitch, result: in_play }
    - kind: ball_in_play
      outcome: sacrifice_bunt
      trajectory: bunt
      fielders: [P]
      advances:
        - { runner: { kind: opponent, id: away-1 }, to: home }
        - { runner: { kind: opponent, id: away-2 }, to: 3 }
then:
  outs: 2
  score: { home: 0, away: 1 }
  nextBatter: { home: 0, away: 4 }
batting:
  away-1: { plateAppearances: 1, atBats: 0, hits: 0, doubles: 0, triples: 0, homeRuns: 0, walks: 1, hitByPitch: 0, strikeouts: 0 }
  away-2: { plateAppearances: 1, atBats: 0, hits: 0, doubles: 0, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 1, strikeouts: 0 }
  away-3: { plateAppearances: 1, atBats: 0, hits: 0, doubles: 0, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 0, strikeouts: 0 }
  away-4: { plateAppearances: 1, atBats: 0, hits: 0, doubles: 0, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 0, strikeouts: 0 }
