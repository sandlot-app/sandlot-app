name: Demo single to left advances the runner from second to third
cite: Official Baseball Rules 5.06(a), 5.09(b)(7), and 9.06(a), https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf
preset: moraga-mustang-first-half
started: true
given:
  bases:
    2: { player: { kind: opponent, id: away-9 }, chargedTo: { kind: player, id: home-1 } }
when:
  - - { kind: pitch, result: in_play }
    - kind: ball_in_play
      outcome: single
      trajectory: line
      fielders: [LF]
      advances: [{ runner: { kind: opponent, id: away-9 }, to: 3 }]
then:
  bases:
    1: { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
    3: { player: { kind: opponent, id: away-9 }, chargedTo: { kind: player, id: home-1 } }
  count: { balls: 0, strikes: 0, pitches: 0 }
  nextBatter: { home: 0, away: 1 }
  pitchCounts: { home-1: 1, away-1: 0 }
