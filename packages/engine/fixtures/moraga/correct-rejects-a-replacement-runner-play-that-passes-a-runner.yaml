name: A Fix whose replacement sends a trailing runner home past the runner on third is refused as runner_passed
cite: Official Baseball Rules 5.09(b)(9) (a runner who passes a preceding runner before that runner is out is out),
  https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf;
  Sandlot docs/contract.md Fix (a replacement is played like any play, so the engine's reason comes back) and Reject reasons; issue 102
preset: moraga-mustang-first-half
started: true
given:
  bases:
    "1": { player: { kind: opponent, id: away-2 }, chargedTo: { kind: player, id: home-1 } }
    "3": { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
when:
  - - { kind: pitch, result: ball }
  - - kind: correct
      target: play-1
      replacement:
        - { kind: runner, event: wild_pitch, runner: { kind: opponent, id: away-2 }, to: home }
then:
  rejected: runner_passed
