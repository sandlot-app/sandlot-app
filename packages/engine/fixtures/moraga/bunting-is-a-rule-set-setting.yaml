name: A sacrifice bunt is an out when the rule set allows bunting
cite: Official Baseball Rules 9.08(a); parent spec 10 rules as data https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf
preset: moraga-mustang-first-half
rules: { bunting: true }
started: true
when:
  - - { kind: pitch, result: in_play }
    - { kind: ball_in_play, outcome: sacrifice_bunt, trajectory: bunt, fielders: [P, 1B], advances: [] }
then:
  outs: 1
  bases: {}
  nextBatter: { home: 0, away: 1 }
  count: { balls: 0, strikes: 0, pitches: 0 }
