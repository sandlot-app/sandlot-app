name: Undo reverses the 65th pitch and its alert
cite: Moraga Mustang E.2, https://www.moragabaseball.org/pony-rules/; Pitch Smart ages 9-10; issue 10 65/75 alert
  policy; Sandlot docs/contract.md Undo; issue 10 whole-play undo
preset: moraga-mustang-first-half
started: true
given:
  pitchCounts:
    home-1: 64
    away-1: 0
when:
  - - kind: pitch
      result: foul
  - - kind: undo
      target: play-1
then:
  pitchCounts:
    home-1: 64
    away-1: 0
  count:
    balls: 0
    strikes: 0
    pitches: 0
  alerts: []
