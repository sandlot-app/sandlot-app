name: A home run that scores the batter but leaves an unlisted runner on second is rejected
cite: Official Baseball Rules 5.06(a)(1), 5.09(b)(9) (a runner who passes a preceding
  runner before that runner is out is out),
  https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf;
  parent spec 10 explicit destinations; ADR 0001. Was home-run-moves-only-listed-runners,
  which accepted the batter passing the runner on second; the scorer must say what happened
preset: moraga-mustang-first-half
started: true
given:
  nextBatter:
    home: 0
    away: 2
  bases:
    "2":
      player:
        kind: opponent
        id: away-2
      chargedTo:
        kind: player
        id: home-1
    "3":
      player:
        kind: opponent
        id: away-1
      chargedTo:
        kind: player
        id: home-1
when:
  - - kind: pitch
      result: in_play
    - kind: ball_in_play
      outcome: home_run
      trajectory: ground
      fielders: []
      advances:
        - runner:
            kind: opponent
            id: away-1
          to: home
then:
  rejected: runner_passed
