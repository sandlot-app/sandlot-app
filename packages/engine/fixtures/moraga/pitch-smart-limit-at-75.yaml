name: The 75th pitch raises the limit alert
cite: Moraga Mustang E.2; Pitch Smart ages 9-10 daily max 75, https://www.mlb.com/pitch-smart/pitching-guidelines/ages-9-12
preset: moraga-mustang-first-half
started: true
given:
  pitchCounts: { home-1: 74, away-1: 0 }
when:
  - [{ kind: pitch, result: foul }]
then:
  pitchCounts: { home-1: 75, away-1: 0 }
  alerts:
    - { kind: pitch_count_at_limit, pitcher: { kind: player, id: home-1 } }
