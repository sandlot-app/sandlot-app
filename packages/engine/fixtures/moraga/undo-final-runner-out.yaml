name: Undo restores a game ended by the final runner out without changing the batter due
cite: Moraga Mustang revised February 2024 D.3 and D.16, https://www.moragabaseball.org/pony-rules/; issue 10 Game end;
  Sandlot docs/contract.md Undo; issue 10 whole-play undo
preset: moraga-mustang-first-half
started: true
given:
  inning: 6
  half: bottom
  score:
    home: 1
    away: 2
  outs: 2
  bases:
    "1":
      player:
        kind: player
        id: home-1
      chargedTo:
        kind: opponent
        id: away-1
  nextBatter:
    home: 4
    away: 0
when:
  - - kind: runner
      event: pickoff
      runner:
        kind: player
        id: home-1
      to: out
  - - kind: undo
      target: play-1
then:
  status: in_progress
  inning: 6
  half: bottom
  score:
    home: 1
    away: 2
  outs: 2
  bases:
    "1":
      player:
        kind: player
        id: home-1
      chargedTo:
        kind: opponent
        id: away-1
  nextBatter:
    home: 4
    away: 0
