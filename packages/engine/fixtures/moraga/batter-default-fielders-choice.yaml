name: The batter destination for fielders_choice is 1
cite: Official Baseball Rules Definitions of Terms, Fielder's Choice
  https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf
preset: moraga-mustang-first-half
started: true
when:
  - - kind: pitch
      result: in_play
    - kind: ball_in_play
      outcome: fielders_choice
      trajectory: null
      fielders: []
      advances: []
then:
  bases:
    "1":
      player:
        kind: opponent
        id: away-1
      chargedTo:
        kind: player
        id: home-1
  score:
    home: 0
    away: 0
  outs: 0
  nextBatter:
    home: 0
    away: 1
  count:
    balls: 0
    strikes: 0
    pitches: 0
  pitchCounts:
    home-1: 1
    away-1: 0
