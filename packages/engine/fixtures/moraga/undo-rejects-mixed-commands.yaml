name: Undo must be the only command in its play
cite: Sandlot docs/contract.md Undo (an undo play holds only the undo command); issue 10 Undo and Game status implementation decisions
preset: moraga-mustang-first-half
started: true
when:
  - - kind: pitch
      result: ball
  - - kind: undo
      target: play-1
    - kind: pitch
      result: called_strike
then:
  rejected: undo_must_be_alone
