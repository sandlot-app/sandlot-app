name: Undo after a removed play still shows the alert the play before it raised
cite: Sandlot docs/contract.md Undo and Fix, the game after an Undo is the game before that play, whatever was removed earlier; Moraga Mustang E.2, https://www.moragabaseball.org/pony-rules/;
  Pitch Smart ages 9-10; issue 102
preset: moraga-mustang-first-half
started: true
given:
  pitchCounts:
    home-1: 64
    away-1: 0
when:
  - - { kind: pitch, result: foul }
  - - { kind: pitch, result: foul }
  - - { kind: correct, target: play-2, replacement: [] }
  - - { kind: pitch, result: foul }
  - - { kind: undo, target: play-4 }
then:
  pitchCounts:
    home-1: 65
    away-1: 0
  count: { balls: 0, strikes: 1, pitches: 1 }
  alerts:
    - kind: pitch_count_near_limit
      pitcher: { kind: player, id: home-1 }
      remaining: 10
