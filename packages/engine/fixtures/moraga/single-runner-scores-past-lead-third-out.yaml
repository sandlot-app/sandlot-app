name: A single cannot score the runner from second when the runner from third makes the third out
cite: Official Baseball Rules 5.08(a) (a run counts only if the runner crosses before the
  third out) and 5.09(b)(9) (a runner who passes a preceding runner before that runner is
  out is out), https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf; docs/contract.md defaults, out order, and crossings. Crossing home
  before the lead runner's third out means passing them, so the play as recorded is rejected
preset: moraga-mustang-first-half
started: true
given:
  outs: 2
  nextBatter: { home: 0, away: 3 }
  bases:
    "2": { player: { kind: opponent, id: away-2 }, chargedTo: { kind: player, id: home-1 } }
    "3": { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
when:
  - - { kind: pitch, result: in_play }
    - kind: ball_in_play
      outcome: single
      trajectory: line
      fielders: [LF]
      advances:
        - { runner: { kind: opponent, id: away-2 }, to: home }
        - { runner: { kind: opponent, id: away-1 }, to: out, outType: non_force }
then:
  rejected: runner_passed
