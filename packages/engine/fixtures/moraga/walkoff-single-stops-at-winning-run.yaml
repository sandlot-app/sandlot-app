name: An ordinary tied regulation walkoff counts only the winning run
cite: 2026 Official Baseball Rules 7.01(e)(3) and 9.06(f); Moraga Mustang D.16; issue 10 story 41
sourceUrl: https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf#page=106
preset: moraga-mustang-first-half
started: true
given:
  inning: 6
  half: bottom
  bases:
    2:
      player: { kind: player, id: home-3 }
      chargedTo: { kind: opponent, id: away-1 }
    3:
      player: { kind: player, id: home-2 }
      chargedTo: { kind: opponent, id: away-1 }
when:
  - - { kind: pitch, result: in_play }
    - kind: ball_in_play
      outcome: single
      trajectory: line
      fielders: [CF]
      advances:
        - { runner: { kind: player, id: home-2 }, to: home }
        - { runner: { kind: player, id: home-3 }, to: home }
then:
  status: final
  score: { home: 1, away: 0 }
  runsThisHalf: 1
  nextBatter: { home: 1, away: 0 }
  count: { balls: 0, strikes: 0, pitches: 0 }
