name: passed_ball scores the identified runner and leaves the other runner in place
cite: Moraga Mustang, https://www.moragabaseball.org/pony-rules/ D.3; Official
  Baseball Rules 5.06(b)(1), 9.13
preset: moraga-mustang-first-half
started: true
given:
  bases:
    "1":
      player:
        kind: opponent
        id: away-2
      chargedTo:
        kind: player
        id: home-1
    "3":
      player:
        kind: opponent
        id: away-1
      chargedTo:
        kind: player
        id: home-1
when:
  - - kind: runner
      event: passed_ball
      runner:
        kind: opponent
        id: away-1
      to: home
then:
  bases:
    "1":
      player:
        kind: opponent
        id: away-2
      chargedTo:
        kind: player
        id: home-1
  score:
    home: 0
    away: 1
  runsThisHalf: 1
