name: Every pitch adds to the current pitcher's count, whatever its result
cite: Moraga Mustang Rules (revised 2/2024), E.2
preset: moraga-mustang-first-half
started: true
when:
  - [{ kind: pitch, result: ball }]
  - [{ kind: pitch, result: called_strike }]
  - [{ kind: pitch, result: foul }]
  - [{ kind: pitch, result: foul }]
  - [{ kind: pitch, result: foul_tip }]
  - [{ kind: pitch, result: swinging_strike }]
  - [{ kind: pitch, result: hit_by_pitch }]
then:
  outs: 1
  count: { balls: 0, strikes: 0, pitches: 0 }
  pitchCounts: { home-1: 7, away-1: 0 }
