name: An explicit batter destination overrides sacrifice_fly
cite: Official Baseball Rules 5.06(a)(1), 5.09; parent spec 10 runner identity,
  explicit destinations, atomic plays; ADR 0001
preset: moraga-mustang-first-half
started: true
when:
  - - kind: pitch
      result: in_play
    - kind: ball_in_play
      outcome: sacrifice_fly
      trajectory: ground
      fielders: []
      advances:
        - runner:
            kind: opponent
            id: away-1
          to: 2
then:
  outs: 0
  bases:
    "2":
      player:
        kind: opponent
        id: away-1
      chargedTo:
        kind: player
        id: home-1
  nextBatter:
    home: 0
    away: 1
  pitchCounts:
    home-1: 1
    away-1: 0
