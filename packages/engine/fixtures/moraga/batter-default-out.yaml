name: The batter destination for out is out
cite: Official Baseball Rules 5.09(a)
  https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf
preset: moraga-mustang-first-half
started: true
when:
  - - kind: pitch
      result: in_play
    - kind: ball_in_play
      outcome: out
      trajectory: null
      fielders: []
      advances: []
then:
  bases: {}
  score:
    home: 0
    away: 0
  outs: 1
  nextBatter:
    home: 0
    away: 1
  count:
    balls: 0
    strikes: 0
    pitches: 0
  pitchCounts:
    home-1: 1
    away-1: 0
