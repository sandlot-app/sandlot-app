name: Undoing a walkoff restores the score and bases
cite: Sandlot docs/contract.md Undo; issue 10 Undo and Game status implementation decisions; Moraga Mustang rules
  revised February 2024 D.16; 2026 Official Baseball Rules 7.01(e); issue 10 Game end and Game status
preset: moraga-mustang-first-half
started: true
given:
  inning: 6
  half: bottom
  count:
    balls: 3
    strikes: 0
    pitches: 3
  bases: &a1
    "1":
      player:
        kind: player
        id: home-2
      chargedTo:
        kind: opponent
        id: away-1
    "2":
      player:
        kind: player
        id: home-3
      chargedTo:
        kind: opponent
        id: away-1
    "3":
      player:
        kind: player
        id: home-4
      chargedTo:
        kind: opponent
        id: away-1
  score:
    home: 2
    away: 2
when:
  - - kind: pitch
      result: ball
  - - kind: undo
      target: play-1
then:
  status: in_progress
  score:
    home: 2
    away: 2
  count:
    balls: 3
    strikes: 0
    pitches: 3
  bases: *a1
  nextBatter:
    home: 0
    away: 0
