name: Undoing every opening play leaves nothing to undo
cite: Sandlot docs/contract.md Undo (undo works before the start; with no play left, nothing_to_undo)
preset: moraga-mustang-first-half
started: false
when:
  - - kind: game
      control:
        kind: lineup_set
        side: away
        lineup:
          - player:
              kind: opponent
              id: away-1
            position: P
  - - kind: game
      control:
        kind: lineup_set
        side: home
        lineup:
          - player:
              kind: player
              id: home-1
            position: P
  - - kind: game
      control:
        kind: start
        umpireStart: 2026-10-25T17:00:00.000Z
  - - kind: undo
      target: play-3
  - - kind: undo
      target: play-2
  - - kind: undo
      target: play-1
  - - kind: undo
      target: play-1
then:
  rejected: nothing_to_undo
