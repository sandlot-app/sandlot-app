name: A wild pitch moving the runner from first to third past the runner who stays on second is rejected in any listing order
cite: Official Baseball Rules 5.09(b)(9) (a runner who passes a preceding runner before
  that runner is out is out), https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf; the engine rejects the play as recorded so the
  scorer says what happened
preset: moraga-mustang-first-half
started: true
given:
  bases:
    "1": { player: { kind: opponent, id: away-3 }, chargedTo: { kind: player, id: home-1 } }
    "2": { player: { kind: opponent, id: away-2 }, chargedTo: { kind: player, id: home-1 } }
    "3": { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
when:
  - - { kind: runner, event: wild_pitch, runner: { kind: opponent, id: away-3 }, to: 3 }
    - { kind: runner, event: wild_pitch, runner: { kind: opponent, id: away-1 }, to: home }
then:
  rejected: runner_passed
