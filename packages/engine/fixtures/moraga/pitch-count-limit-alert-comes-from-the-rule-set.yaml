name: The pitch-count limit alert comes from the rule set, not a fixed 75
cite: AGENTS.md rule 4 (league rules are data in a RuleSet); Moraga Mustang E.2
preset: moraga-mustang-first-half
started: true
rules:
  pitchCountLimits:
    warnAt: 10
    limit: 12
given:
  pitchCounts:
    home-1: 11
    away-1: 0
when:
  - - kind: pitch
      result: ball
then:
  pitchCounts:
    home-1: 12
    away-1: 0
  alerts:
    - kind: pitch_count_at_limit
      pitcher:
        kind: player
        id: home-1
