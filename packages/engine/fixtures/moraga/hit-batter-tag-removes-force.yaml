name: Tagging the batter after a single removes the trailing runner's force before the third out
cite: Official Baseball Rules 5.08(a), 5.09(b)(6), 9.06(c)
  https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf
preset: moraga-mustang-first-half
started: true
given:
  outs: 1
  nextBatter: { home: 0, away: 3 }
  bases:
    "1":
      player: { kind: opponent, id: away-3 }
      chargedTo: { kind: player, id: home-1 }
    "3":
      player: { kind: opponent, id: away-1 }
      chargedTo: { kind: player, id: home-1 }
when:
  - - kind: pitch
      result: in_play
    - kind: ball_in_play
      outcome: single
      trajectory: line
      fielders: [RF, 2B, SS]
      advances:
        - runner: { kind: opponent, id: away-4 }
          to: out
          outType: non_force
        - runner: { kind: opponent, id: away-1 }
          to: home
        - runner: { kind: opponent, id: away-3 }
          to: out
          outType: non_force
then:
  score: { home: 0, away: 1 }
  half: bottom
  outs: 0
  bases: {}
