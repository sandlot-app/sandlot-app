name: Undo after a Fix brings back the original play
cite: Sandlot GLOSSARY.md Fix and Undo; docs/design/spec-update-fix-and-delay.md Rules, Undo after a fix reverses the fix; ADR 0007 Undo brings back
  the original; issue 102
preset: moraga-mustang-first-half
started: true
given:
  nextBatter: { home: 0, away: 1 }
  bases:
    2: { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
when:
  - - { kind: pitch, result: in_play }
    - { kind: ball_in_play, outcome: single, trajectory: line, fielders: [LF], advances: [] }
  - - kind: correct
      target: play-1
      replacement:
        - { kind: pitch, result: in_play }
        - kind: ball_in_play
          outcome: double
          trajectory: line
          fielders: [LF]
          advances:
            - { runner: { kind: opponent, id: away-1 }, to: home }
  - - { kind: undo, target: play-2 }
then:
  bases:
    1: { player: { kind: opponent, id: away-2 }, chargedTo: { kind: player, id: home-1 } }
    2: { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
  score: { home: 0, away: 0 }
  runsThisHalf: 0
  nextBatter: { home: 0, away: 2 }
  pitchCounts: { home-1: 1, away-1: 0 }
batting:
  away-2: { plateAppearances: 1, atBats: 1, hits: 1, doubles: 0, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 0, strikeouts: 0, runs: 0, runsBattedIn: 0 }
