name: Another pitch cannot interrupt an unresolved ball in play
cite: Official Baseball Rules 5.06(a)(1), 5.09; parent spec 10 runner identity,
  explicit destinations, atomic plays; ADR 0001
preset: moraga-mustang-first-half
started: true
when:
  - - kind: pitch
      result: in_play
    - kind: pitch
      result: ball
    - kind: ball_in_play
      outcome: single
      trajectory: ground
      fielders: []
      advances: []
then:
  rejected: in_play_needs_outcome
