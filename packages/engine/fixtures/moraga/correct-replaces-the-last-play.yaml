name: A Fix replaces the last play, so a single becomes a double that scores the runner
cite: Sandlot GLOSSARY.md Fix; docs/design/spec-update-fix-and-delay.md Rules; ADR 0007 a voice fix saves right away; Official Baseball Rules
  9.05(a) for the hit and 9.04(a)(1) for the batter's RBI; issue 102
preset: moraga-mustang-first-half
started: true
given:
  nextBatter: { home: 0, away: 1 }
  bases:
    2: { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
when:
  - - { kind: pitch, result: in_play }
    - { kind: ball_in_play, outcome: single, trajectory: line, fielders: [LF], advances: [] }
  - - kind: correct
      target: play-1
      replacement:
        - { kind: pitch, result: in_play }
        - kind: ball_in_play
          outcome: double
          trajectory: line
          fielders: [LF]
          advances:
            - { runner: { kind: opponent, id: away-1 }, to: home }
then:
  bases:
    2: { player: { kind: opponent, id: away-2 }, chargedTo: { kind: player, id: home-1 } }
  score: { home: 0, away: 1 }
  runsThisHalf: 1
  nextBatter: { home: 0, away: 2 }
  pitchCounts: { home-1: 1, away-1: 0 }
batting:
  away-2: { plateAppearances: 1, atBats: 1, hits: 1, doubles: 1, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 0, strikeouts: 0, runs: 0, runsBattedIn: 1 }
  away-1: { plateAppearances: 0, atBats: 0, hits: 0, doubles: 0, triples: 0, homeRuns: 0, walks: 0, hitByPitch: 0, strikeouts: 0, runs: 1, runsBattedIn: 0 }
