name: One runner play cannot move the same runner twice
cite: Official Baseball Rules 5.06(a)(1), 5.09(b)(9), https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf; docs/contract.md
  defaults, out order, and crossings (safe destinations describe final bases). Two moves
  for one runner could hide a pass, so the play is rejected as it is for a ball in play
preset: moraga-mustang-first-half
started: true
given:
  bases:
    "1": { player: { kind: opponent, id: away-2 }, chargedTo: { kind: player, id: home-1 } }
    "2": { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
when:
  - - { kind: runner, event: stolen_base, runner: { kind: opponent, id: away-2 }, to: 3 }
    - { kind: runner, event: pickoff, runner: { kind: opponent, id: away-2 }, to: out }
then:
  rejected: duplicate_runner
