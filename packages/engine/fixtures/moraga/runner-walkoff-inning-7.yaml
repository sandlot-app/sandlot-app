name: A passed-ball run wins immediately in inning 7
cite: Moraga Mustang revised February 2024 D.3 and D.16, https://www.moragabaseball.org/pony-rules/; issue 10 Game end;
  Sandlot docs/contract.md Undo; issue 10 whole-play undo
preset: moraga-mustang-first-half
started: true
given:
  inning: 7
  half: bottom
  score:
    home: 2
    away: 2
  bases:
    "3":
      player:
        kind: player
        id: home-1
      chargedTo:
        kind: opponent
        id: away-1
when:
  - - kind: runner
      event: passed_ball
      runner:
        kind: player
        id: home-1
      to: home
then:
  status: final
  inning: 7
  half: bottom
  score:
    home: 3
    away: 2
  bases: {}
