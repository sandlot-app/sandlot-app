name: A wild pitch cannot score the runner from second when the runner from third makes the third out
cite: Official Baseball Rules 5.08(a) (a run counts only if the runner crosses before the
  third out) and 5.09(b)(9) (a runner who passes a preceding runner before that runner is
  out is out), https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf. Crossing home before the lead runner's third out means passing them,
  so the play as recorded is rejected
preset: moraga-mustang-first-half
started: true
given:
  outs: 2
  bases:
    "2": { player: { kind: opponent, id: away-2 }, chargedTo: { kind: player, id: home-1 } }
    "3": { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
when:
  - - { kind: runner, event: wild_pitch, runner: { kind: opponent, id: away-1 }, to: out }
    - { kind: runner, event: wild_pitch, runner: { kind: opponent, id: away-2 }, to: home }
then:
  rejected: runner_passed
