name: Multiple complete balls in play retain the final bases count and batting order
cite: Official Baseball Rules 5.06(a)(1), 5.09; parent spec 10 runner identity,
  explicit destinations, atomic plays; ADR 0001
preset: moraga-mustang-first-half
started: true
when:
  - - &a1
      kind: pitch
      result: in_play
    - kind: ball_in_play
      outcome: single
      trajectory: ground
      fielders: []
      advances: []
    - *a1
    - kind: ball_in_play
      outcome: double
      trajectory: ground
      fielders: []
      advances:
        - runner:
            kind: opponent
            id: away-1
          to: 3
    - kind: pitch
      result: ball
then:
  bases:
    "2":
      player:
        kind: opponent
        id: away-2
      chargedTo:
        kind: player
        id: home-1
    "3":
      player:
        kind: opponent
        id: away-1
      chargedTo:
        kind: player
        id: home-1
  nextBatter:
    home: 0
    away: 2
  count:
    balls: 1
    strikes: 0
    pitches: 1
  pitchCounts:
    home-1: 3
    away-1: 0
