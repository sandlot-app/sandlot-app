name: Runners on one play move together, so a trailing runner may take a base the lead runner leaves
cite: Official Baseball Rules 5.06(a)(1), https://mktg.mlbstatic.com/mlb/official-information/2026-official-baseball-rules.pdf; docs/contract.md defaults, out
  order, and crossings (safe destinations describe final bases). The order the moves are
  listed in doesn't matter
preset: moraga-mustang-first-half
started: true
given:
  bases:
    "1": { player: { kind: opponent, id: away-2 }, chargedTo: { kind: player, id: home-1 } }
    "2": { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
when:
  - - { kind: runner, event: passed_ball, runner: { kind: opponent, id: away-2 }, to: 2 }
    - { kind: runner, event: passed_ball, runner: { kind: opponent, id: away-1 }, to: 3 }
then:
  bases:
    "2": { player: { kind: opponent, id: away-2 }, chargedTo: { kind: player, id: home-1 } }
    "3": { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
