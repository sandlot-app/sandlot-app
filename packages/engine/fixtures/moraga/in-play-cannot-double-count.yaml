name: A second in-play pitch cannot replace the first before its outcome
cite: Official Baseball Rules 5.06(a)(1), 5.09; parent spec 10 runner identity,
  explicit destinations, atomic plays; ADR 0001
preset: moraga-mustang-first-half
started: true
when:
  - - &a1
      kind: pitch
      result: in_play
    - *a1
    - kind: ball_in_play
      outcome: single
      trajectory: ground
      fielders: []
      advances: []
then:
  rejected: in_play_needs_outcome
