name: An advance cannot create a runner from a roster player not batting or on base
cite: Official Baseball Rules 5.06(a)(1), 5.09; parent spec 10 runner identity,
  explicit destinations, atomic plays; ADR 0001
preset: moraga-mustang-first-half
started: true
when:
  - - kind: pitch
      result: in_play
    - kind: ball_in_play
      outcome: single
      trajectory: ground
      fielders: []
      advances:
        - runner:
            kind: opponent
            id: away-8
          to: 2
then:
  rejected: runner_not_on_base
