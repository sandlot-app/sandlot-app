name: A second outcome cannot reuse the resolved in-play pitch
cite: Official Baseball Rules 5.06(a)(1), 5.09; parent spec 10 runner identity,
  explicit destinations, atomic plays; ADR 0001
preset: moraga-mustang-first-half
started: true
when:
  - - kind: pitch
      result: in_play
    - kind: ball_in_play
      outcome: single
      trajectory: ground
      fielders: []
      advances: []
    - kind: ball_in_play
      outcome: out
      trajectory: ground
      fielders: []
      advances: []
then:
  rejected: ball_in_play_needs_pitch
