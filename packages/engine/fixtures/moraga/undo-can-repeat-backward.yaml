name: Successive undos skip prior undo plays and restore both pitches
cite: Sandlot docs/contract.md Undo; issue 10 Undo and Game status implementation decisions
preset: moraga-mustang-first-half
started: true
when:
  - - kind: pitch
      result: ball
  - - kind: pitch
      result: called_strike
  - - kind: undo
      target: play-2
  - - kind: undo
      target: play-1
then:
  count:
    balls: 0
    strikes: 0
    pitches: 0
  pitchCounts:
    home-1: 0
    away-1: 0
