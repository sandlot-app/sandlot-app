name: A hit by pitch with the bases loaded forces every runner up and a run in
cite: Official Baseball Rules 5.05(b)(2), 5.06(b)(3)(B) and 5.08(a)
preset: moraga-mustang-first-half
started: true
given:
  half: bottom
  nextBatter: { home: 3, away: 0 }
  bases:
    1: { player: { kind: player, id: home-3 }, chargedTo: { kind: opponent, id: away-1 } }
    2: { player: { kind: player, id: home-2 }, chargedTo: { kind: opponent, id: away-1 } }
    3: { player: { kind: player, id: home-1 }, chargedTo: { kind: opponent, id: away-1 } }
when:
  - [{ kind: pitch, result: hit_by_pitch }]
then:
  bases:
    1: { player: { kind: player, id: home-4 }, chargedTo: { kind: opponent, id: away-1 } }
    2: { player: { kind: player, id: home-3 }, chargedTo: { kind: opponent, id: away-1 } }
    3: { player: { kind: player, id: home-2 }, chargedTo: { kind: opponent, id: away-1 } }
  score: { home: 1, away: 0 }
  runsThisHalf: 1
  nextBatter: { home: 4, away: 0 }
  pitchCounts: { home-1: 0, away-1: 1 }
