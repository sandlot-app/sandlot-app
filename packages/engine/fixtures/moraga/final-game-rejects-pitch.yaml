name: A pitch cannot be recorded after a called game ends
cite: Moraga Mustang rules revised February 2024 D.16; 2026 Official Baseball Rules 7.01(e); issue 10 Game status
  and issue 15 post-final rejection acceptance criterion
preset: moraga-mustang-first-half
started: true
when:
  - - kind: game
      control:
        kind: end_game
        reason: called
  - - kind: pitch
      result: ball
then:
  rejected: game_over
