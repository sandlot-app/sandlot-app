name: Mustang rejects a bunt
cite: Moraga Mustang Rules (revised 2/2024), D.7 https://www.moragabaseball.org/pony-rules/
preset: moraga-mustang-first-half
started: true
when:
  - - kind: pitch
      result: in_play
    - kind: ball_in_play
      outcome: sacrifice_bunt
      trajectory: bunt
      fielders: [P, 1B]
      advances: []
then:
  rejected: bunting_not_allowed
