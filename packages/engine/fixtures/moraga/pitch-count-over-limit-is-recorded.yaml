name: A pitch past 75 is recorded and does not repeat the limit alert
cite: Moraga Mustang E.2; Pitch Smart ages 9-10 daily max 75,
  https://www.mlb.com/pitch-smart/pitching-guidelines/ages-9-12; issue 10 alert
  policy
preset: moraga-mustang-first-half
started: true
given:
  pitchCounts:
    home-1: 74
    away-1: 0
when:
  - - kind: pitch
      result: foul
  - - kind: pitch
      result: foul
then:
  pitchCounts:
    home-1: 76
    away-1: 0
  alerts: []
