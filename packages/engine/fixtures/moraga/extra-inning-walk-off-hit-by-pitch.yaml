name: A forced-in hit by pitch ends bottom seven immediately
cite: Moraga Mustang rules revised February 2024 D.16; 2026 Official Baseball Rules 7.01(e); issue 10 Game end and Game
  status; Official Baseball Rules 5.08(b)
preset: moraga-mustang-first-half
started: true
given:
  inning: 7
  half: bottom
  bases:
    "1":
      player:
        kind: player
        id: home-2
      chargedTo:
        kind: opponent
        id: away-1
    "2":
      player:
        kind: player
        id: home-3
      chargedTo:
        kind: opponent
        id: away-1
    "3":
      player:
        kind: player
        id: home-4
      chargedTo:
        kind: opponent
        id: away-1
  score:
    home: 2
    away: 2
when:
  - - kind: pitch
      result: hit_by_pitch
then:
  status: final
  score:
    home: 3
    away: 2
