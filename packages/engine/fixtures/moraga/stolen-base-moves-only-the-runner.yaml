name: A steal moves the identified runner from first to second without ending the at-bat
cite: Moraga Mustang D.1, https://www.moragabaseball.org/pony-rules/
preset: moraga-mustang-first-half
started: true
given:
  count: { balls: 2, strikes: 1, pitches: 3 }
  nextBatter: { home: 0, away: 2 }
  bases:
    1: { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
    3: { player: { kind: opponent, id: away-2 }, chargedTo: { kind: player, id: home-1 } }
when:
  - [{ kind: runner, event: stolen_base, runner: { kind: opponent, id: away-1 }, to: 2 }]
then:
  count: { balls: 2, strikes: 1, pitches: 3 }
  nextBatter: { home: 0, away: 2 }
  bases:
    2: { player: { kind: opponent, id: away-1 }, chargedTo: { kind: player, id: home-1 } }
    3: { player: { kind: opponent, id: away-2 }, chargedTo: { kind: player, id: home-1 } }
